<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64" role="img" aria-label="AI Tech Hub Logo">
  <defs>
    
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39D5FF" />
      <stop offset="50%" stop-color="#6C8BFF" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>

    
    <linearGradient id="accentGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#39D5FF" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>

    
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="haloCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39D5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#39D5FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  
  <g transform="translate(6, 6)">
    
    <circle cx="26" cy="26" r="24" fill="url(#haloCyan)" opacity="0.3" filter="url(#nodeGlow)" />

    
    
    <line x1="26" y1="6" x2="8" y2="46" stroke="url(#aiGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="26" y1="6" x2="44" y2="46" stroke="url(#aiGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    
    <line x1="16" y1="30" x2="36" y2="30" stroke="url(#aiGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="26" y1="6" x2="26" y2="30" stroke="url(#aiGrad)" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.8" />
    <line x1="8" y1="46" x2="26" y2="30" stroke="url(#aiGrad)" stroke-width="1.8" opacity="0.7" />
    <line x1="44" y1="46" x2="26" y2="30" stroke="url(#aiGrad)" stroke-width="1.8" opacity="0.7" />
    <line x1="16" y1="30" x2="26" y2="48" stroke="url(#aiGrad)" stroke-width="1.5" opacity="0.6" />
    <line x1="36" y1="30" x2="26" y2="48" stroke="url(#aiGrad)" stroke-width="1.5" opacity="0.6" />

    
    
    <circle cx="26" cy="6" r="5" fill="#0B1020" stroke="#39D5FF" stroke-width="2" />
    <circle cx="26" cy="6" r="2.2" fill="#39D5FF" filter="url(#nodeGlow)" />

    
    <circle cx="8" cy="46" r="5" fill="#0B1020" stroke="#39D5FF" stroke-width="2" />
    <circle cx="8" cy="46" r="2.2" fill="#39D5FF" />

    
    <circle cx="44" cy="46" r="5" fill="#0B1020" stroke="#8B7CFF" stroke-width="2" />
    <circle cx="44" cy="46" r="2.2" fill="#8B7CFF" />

    
    <circle cx="16" cy="30" r="4" fill="#0B1020" stroke="#55A8FF" stroke-width="1.8" />
    <circle cx="16" cy="30" r="1.8" fill="#55A8FF" />

    
    <circle cx="36" cy="30" r="4" fill="#0B1020" stroke="#7A84FF" stroke-width="1.8" />
    <circle cx="36" cy="30" r="1.8" fill="#7A84FF" />

    
    <circle cx="26" cy="30" r="4.5" fill="#0B1020" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="26" cy="30" r="2" fill="#FFFFFF" filter="url(#nodeGlow)" />

    
    <circle cx="26" cy="48" r="3" fill="#8B7CFF" opacity="0.9" />
  </g>

  
  <g transform="translate(70, 0)">
    
    <text x="0" y="39" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="24" 
          letter-spacing="0.5" 
          fill="url(#aiGrad)">AI</text>

    
    <text x="33" y="39" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="24" 
          letter-spacing="1" 
          fill="#FFFFFF">TECH</text>

    
    <g transform="translate(112, 18)">
      <rect x="0" y="2" width="58" height="23" rx="6" fill="#111A2E" stroke="#39D5FF" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="29" y="18" 
            text-anchor="middle"
            font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-weight="800" 
            font-size="13" 
            letter-spacing="2" 
            fill="#39D5FF">HUB</text>
    </g>

    
    <text x="2" y="53" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" 
          font-size="8" 
          letter-spacing="3.2" 
          fill="#697386">SEO • AI • WEB DEVELOPMENT</text>
  </g>
</svg>

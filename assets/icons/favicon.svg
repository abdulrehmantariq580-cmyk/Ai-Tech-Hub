<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64" role="img" aria-label="AI Tech Hub Favicon">
  <defs>
    <linearGradient id="favAiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39D5FF" />
      <stop offset="60%" stop-color="#6C8BFF" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A2E" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>
    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBgGrad)" stroke="#39D5FF" stroke-width="1.5" stroke-opacity="0.5" />

  
  <g transform="translate(6, 6)">
    
    <line x1="26" y1="8" x2="10" y2="44" stroke="url(#favAiGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="26" y1="8" x2="42" y2="44" stroke="url(#favAiGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="28" x2="34" y2="28" stroke="url(#favAiGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    
    <line x1="26" y1="8" x2="26" y2="28" stroke="url(#favAiGrad)" stroke-width="2" stroke-dasharray="2 2" opacity="0.85" />
    <line x1="10" y1="44" x2="26" y2="28" stroke="url(#favAiGrad)" stroke-width="2" opacity="0.7" />
    <line x1="42" y1="44" x2="26" y2="28" stroke="url(#favAiGrad)" stroke-width="2" opacity="0.7" />

    
    
    <circle cx="26" cy="8" r="4.5" fill="#0B1020" stroke="#39D5FF" stroke-width="2" />
    <circle cx="26" cy="8" r="2.2" fill="#39D5FF" filter="url(#favGlow)" />

    
    <circle cx="10" cy="44" r="4.5" fill="#0B1020" stroke="#39D5FF" stroke-width="2" />
    <circle cx="10" cy="44" r="2.2" fill="#39D5FF" />

    
    <circle cx="42" cy="44" r="4.5" fill="#0B1020" stroke="#8B7CFF" stroke-width="2" />
    <circle cx="42" cy="44" r="2.2" fill="#8B7CFF" />

    
    <circle cx="26" cy="28" r="4" fill="#0B1020" stroke="#39D5FF" stroke-width="2" />
    <circle cx="26" cy="28" r="2" fill="#FFFFFF" filter="url(#favGlow)" />
  </g>
</svg>
